# Local dev stack: Postgres and Mailpit (SMTP catcher).
#
# Every port is published on the loopback addresses only (IPv4 and IPv6, so `localhost` works
# either way). A bare "5434:5432" listens on all interfaces, and Docker Desktop's firewall rule
# admits it on every network profile: anyone on the same Wi-Fi could log in to Postgres as the
# superuser.
#
# On the owner's PC this Postgres is still the old Cloudflare deployment's production database,
# reached through a cloudflared container that is no longer defined here (docs/aws-deployment.md,
# "Retiring the old Cloudflare deployment"). Until that is retired, leave the postgres service's
# TLS and restart settings as they are, and never run `docker compose down` or `--remove-orphans`
# in that checkout.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      # Only read when the data volume is first created. Anything reachable from elsewhere needs a
      # real password: see docs/security.md, "Database credentials".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    ports: ["127.0.0.1:${PG_PORT:-5434}:5432", "[::1]:${PG_PORT:-5434}:5432"]
    # The old deployment's production runs on this container: come back after a Docker or PC restart.
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./infra/postgres/certs:/certs:ro
    # If infra/postgres/certs/server.{crt,key} exist, enable SSL (optional for clients; the old
    # deployment's connection requires it); the key is copied so Postgres sees the
    # ownership/permissions it insists on.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -f /certs/server.key ]; then
          install -o postgres -m 600 /certs/server.key /var/lib/postgresql/server.key
          install -o postgres -m 644 /certs/server.crt /var/lib/postgresql/server.crt
          set -- -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
        fi
        exec docker-entrypoint.sh postgres "$$@"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "[::1]:1025:1025", "127.0.0.1:8025:8025", "[::1]:8025:8025"]
  # WhatsApp Automation's Evolution API (docs/whatsapp.md, "Running it locally"), only with
  # `docker compose --profile whatsapp up -d evolution`. The same release production runs
  # (infra/cdk/lib/whatsapp-stack.ts), with a database of its own: never the postgres service above.
  # Point the app at it with EVOLUTION_API_URL=http://127.0.0.1:8081, EVOLUTION_API_KEY (below) and
  # EVOLUTION_WEBHOOK_URL=http://host.docker.internal:<API port>/api.
  evolution:
    profiles: ["whatsapp"]
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    depends_on: [evolution-postgres]
    environment:
      TZ: UTC
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://127.0.0.1:8081
      SERVER_DISABLE_DOCS: "true"
      SERVER_DISABLE_MANAGER: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: insights_a
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-local-evolution-key-change-me}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      LOG_LEVEL: ERROR,WARN
      LOG_COLOR: "false"
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: bizinsights
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "6"
      TELEMETRY_ENABLED: "false"
      WA_BUSINESS_VERSION: v26.0
    ports: ["127.0.0.1:8081:8080", "[::1]:8081:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  evolution-postgres:
    profiles: ["whatsapp"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes: ["evolution-pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata: {}
  evolution-pgdata: {}

# Local dev stack: Postgres, Mailpit (SMTP catcher), a Cognito emulator.
#
# Every port is published on the loopback addresses only (IPv4 and IPv6, so `localhost` works
# either way). A bare "5434:5432" listens on all interfaces, and Docker Desktop's firewall rule
# admits it on every network profile: anyone on the same Wi-Fi could log in to Postgres as the
# superuser.
#
# On the owner's PC this Postgres is still the old Cloudflare deployment's production database,
# reached through a cloudflared container that is no longer defined here (docs/aws-deployment.md,
# "Retiring the old Cloudflare deployment"). Until that is retired, leave the postgres service's
# TLS and restart settings as they are, and never run `docker compose down` or `--remove-orphans`
# in that checkout.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      # Only read when the data volume is first created. Anything reachable from elsewhere needs a
      # real password: see docs/security.md, "Database credentials".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    ports: ["127.0.0.1:${PG_PORT:-5434}:5432", "[::1]:${PG_PORT:-5434}:5432"]
    # The old deployment's production runs on this container: come back after a Docker or PC restart.
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./infra/postgres/certs:/certs:ro
    # If infra/postgres/certs/server.{crt,key} exist, enable SSL (optional for clients; the old
    # deployment's connection requires it); the key is copied so Postgres sees the
    # ownership/permissions it insists on.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -f /certs/server.key ]; then
          install -o postgres -m 600 /certs/server.key /var/lib/postgresql/server.key
          install -o postgres -m 644 /certs/server.crt /var/lib/postgresql/server.crt
          set -- -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
        fi
        exec docker-entrypoint.sh postgres "$$@"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "[::1]:1025:1025", "127.0.0.1:8025:8025", "[::1]:8025:8025"]
  # Amazon Cognito emulator with the app's user pool in it (infra/cognito-local/README.md).
  cognito:
    image: node:24-alpine
    working_dir: /data
    # Its tokens name http://127.0.0.1:9229 as their issuer, which is where the local server reaches it.
    command: >-
      sh -c "[ -f .cognito/db/local_insights.json ] || cp -r /seed/.cognito .;
      printf '{\"TokenConfig\":{\"IssuerDomain\":\"http://127.0.0.1:9229\"}}' > .cognito/config.json;
      HOST=0.0.0.0 PORT=9229 exec npx -y cognito-local@5.3.0"
    volumes: ["./infra/cognito-local/seed:/seed:ro", "cognito-data:/data"]
    ports: ["127.0.0.1:9229:9229", "[::1]:9229:9229"]
volumes:
  pgdata: {}
  cognito-data: {}

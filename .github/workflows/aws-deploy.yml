name: Deploy to AWS

# Push to main (after CI's checks pass on the same commit) or run by hand. Deploys with GitHub's
# OIDC token exchanged for the role in InsightsCi-production: no AWS keys are stored in GitHub.
# Setup (once): repository → Settings → Environments → "production", with the variable
# AWS_DEPLOY_ROLE_ARN = the InsightsCi-production stack's DeployRoleArn output.
# docs/aws-deployment.md has the rest.
#
# Two jobs. `build` installs every dependency, runs the unit tests and builds the Lambda package
# (API + UI) with no way to reach AWS: it can't ask for an OIDC token. `deploy` is the only job
# that can, and it installs only infra/cdk's tools (aws-cdk-lib, the CDK CLI, tsx), with no install
# scripts, then deploys the package `build` made. So code from the app's ~1,500 dependencies (a
# compromised package's install script, or anything that runs during the web build) never runs
# where the deploy role, and through CDK's roles the whole account, is one request away.
#
# cdk deploy runs each release's migrations on its new cron version before the `live` aliases
# move (infra/cdk/lib/migrate-before-live.ts), so new code never reads a column that isn't there yet.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: aws-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

# Every `run:` is bash: on a self-hosted Windows runner, Git Bash (see ci.yml).
defaults:
  run:
    shell: bash

env:
  # The Lambda package `build` hands to `deploy`, in the Actions cache (artifact storage is full on
  # this plan). Caches made on main can't be written by pull requests, and the key is this run's.
  PACKAGE_KEY: aws-deploy-package-${{ github.run_id }}-${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    # By hand only from main: the production environment has no branch rule on this plan, and a
    # dispatch on any other branch would deploy code that never passed CI. After CI, only its run
    # for a push to main: `branches: [main]` above also matches a pull request from a branch named
    # main, whose run may skip the browser tests (ci.yml). A change of only docs starts no CI run,
    # so it deploys nothing; CI skipping a job it already passed on the same tree still succeeds.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # The runner the repository variable SELF_HOSTED_MAIN_RUNNER names: the PC's runner for main,
    # under its own account, which refuses every job but main's CI and this workflow from main
    # (docs/aws-deployment.md). Pull-request jobs run code nobody has reviewed yet, and on a shared
    # runner whatever they leave behind (the cached Node, pnpm and store) both jobs would run with.
    # Without it, the same runner as CI: GitHub's ubuntu-latest, or SELF_HOSTED_RUNNER (ci.yml).
    runs-on: ${{ fromJSON(vars.SELF_HOSTED_MAIN_RUNNER || vars.SELF_HOSTED_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - name: Git Bash and a lasting pnpm store (Windows runner)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          echo npm_config_store_dir=%RUNNER_TOOL_CACHE%\pnpm-store>>"%GITHUB_ENV%"
      - name: On the runner pull requests use
        if: vars.SELF_HOSTED_MAIN_RUNNER == '' && vars.SELF_HOSTED_RUNNER != ''
        run: echo "::warning::Deploying on the runner pull requests use. Install the runner for main and set SELF_HOSTED_MAIN_RUNNER (docs/aws-deployment.md)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: "true"
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # As in ci.yml: the laptop holds a power request until the job ends, so it doesn't sleep
      # mid-deploy (docs/aws-deployment.md).
      - name: Keep the PC awake for this job (self-hosted runner)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infra/runner/keep-awake.ps1
      # Set up Node before installing the exact pnpm from package.json. The action's
      # bootstrap self-update adds registry lookups that timed out on the Windows runner.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the pinned pnpm (cached on this runner)
        run: node infra/runner/setup-pnpm.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # A self-hosted runner keeps its pnpm store between runs (first step): no cache to move.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      # Install scripts run only for the packages package.json's pnpm.onlyBuiltDependencies names.
      - run: pnpm install --frozen-lockfile
        env: { DATABASE_URL: "postgresql://build:build@localhost:5432/build" }
      - name: Unit tests (AWS adapters, CDK)
        run: pnpm --filter @app/aws --filter @infra/cdk test
      - name: Build the Lambda package (API + UI)
        run: pnpm --filter @app/aws build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/aws/dist/function
          key: ${{ env.PACKAGE_KEY }}

  deploy:
    needs: build
    runs-on: ${{ fromJSON(vars.SELF_HOSTED_MAIN_RUNNER || vars.SELF_HOSTED_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    environment: production
    # The only job that can ask GitHub for the OIDC token the deploy role trusts.
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
    steps:
      - name: Git Bash and a lasting pnpm store (Windows runner)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          echo npm_config_store_dir=%RUNNER_TOOL_CACHE%\pnpm-store>>"%GITHUB_ENV%"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: "true"
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Keep the PC awake for this job (self-hosted runner)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infra/runner/keep-awake.ps1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the pinned pnpm (cached on this runner)
        run: node infra/runner/setup-pnpm.mjs
      # infra/cdk's own dependencies only, and no package's install script runs (esbuild, which tsx
      # uses, finds its binary through its platform package without one).
      - name: Install the deploy tools only (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @infra/cdk
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/aws/dist/function
          key: ${{ env.PACKAGE_KEY }}
          fail-on-cache-miss: true
      # This job's token carries the claims infra/cdk/lib/config.ts expects (githubDeployClaims):
      # checked before signing in, so a trust this token couldn't meet is never deployed, and a
      # mismatch reads plainly instead of as STS's "Not authorized". This file is the default
      # branch's, the checkout may be an older commit's (a CI run for it that ended after a merge):
      # without the script there is nothing to check.
      - name: Token claims the deploy role requires
        run: |
          if [[ ! -f infra/cdk/scripts/oidc-trust.ts ]]; then echo "::notice::This commit has no infra/cdk/scripts/oidc-trust.ts: nothing to check."; exit 0; fi
          pnpm --filter @infra/cdk exec tsx scripts/oidc-trust.ts claims --env production
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      # On a self-hosted machine the SDKs could otherwise find someone's own AWS sign-in.
      - name: Signed in as the deploy role
        env: { ROLE: "${{ vars.AWS_DEPLOY_ROLE_ARN }}" }
        run: |
          arn=$(aws sts get-caller-identity --query Arn --output text)
          echo "$arn"
          [[ -n "$ROLE" && "$arn" == *":assumed-role/${ROLE##*/}/"* ]]
      # This commit's deploy role trust requires the workflow and branch claims: before cdk deploy
      # gives it that trust, the trust-check roles must prove IAM checks them and this workflow meets
      # them, or a wrong trust would lock the next deploy out (oidc-trust.ts prove). A commit from
      # before that check has nothing to prove.
      - name: The trust this commit deploys is proven
        env: { ROLE: "${{ vars.AWS_DEPLOY_ROLE_ARN }}" }
        run: |
          if ! grep -q 'mode === "prove"' infra/cdk/scripts/oidc-trust.ts 2>/dev/null; then echo "::notice::This commit's oidc-trust.ts has no prove mode: nothing to prove."; exit 0; fi
          pnpm --filter @infra/cdk exec tsx scripts/oidc-trust.ts prove --role "$ROLE" --region "$AWS_REGION"
      - name: Record the release being replaced
        id: before
        run: |
          v() { aws lambda get-alias --function-name "insights-production-$1" --name live --query FunctionVersion --output text 2>/dev/null || true; }
          echo "versions=api=$(v api),jobs=$(v jobs),cron=$(v cron)" >> "$GITHUB_OUTPUT"
      # The functions read /insights/production/runtime (the Auth stack's: Cognito's ids and domain,
      # COGNITO_IDENTITY_PROVIDERS) once per cold start, and the Auth stack deploys after the App
      # stack has moved `live`. A digest only: nothing of the value goes into the log (the CLI's
      # error, on stderr, has none of it, and says why a read failed).
      # MSYS_NO_PATHCONV: Git Bash hands a native program an argument that starts with / as a Windows
      # path, so aws.exe asked SSM for "C:/Program Files/Git/insights/production/runtime", which the
      # deploy role may not read, and every Deploy from 2026-10-19 to 11-01 warned and restarted nothing.
      - name: Runtime settings before the deploy
        id: runtime_before
        env: { MSYS_NO_PATHCONV: "1" }
        run: |
          d=$(aws ssm get-parameter --name /insights/production/runtime --query Parameter.Value --output text | sha256sum | cut -c1-64) || d=""
          echo "digest=${d:-unknown}" >> "$GITHUB_OUTPUT"
      # The PC's connection drops calls now and then: CDK then can't assume its bootstrap roles
      # ("could not be used to assume ... Proceeding anyway", and the base role is refused what only
      # they may do) or a socket never connects, and the deploy fails with nothing in AWS changed
      # (2026-10-19, and twice on 2026-10-23). cdk deploy is safe to repeat, so a failure that reads
      # like the network is tried again a minute later, three attempts in all. Any other failure goes
      # straight to the rollback below. "no credentials have been configured" is the account lookup,
      # STS's first call, that didn't get through: this job always has the deploy role's credentials.
      # The CLI (aws-cdk 2.1143.0) gives S3 and CloudFormation calls 7 tries of 10 s to connect, the
      # account lookup 3, and assuming its roles the SDK's default of 3 (about 30 s), which only
      # AWS_MAX_ATTEMPTS changes: at 10 (about 2 minutes) a short drop there doesn't fail the run.
      # Node tries each of a host's addresses for 250 ms before the next, under the hotspot's ~300 ms
      # round trip: 6 of 15 connects to CDK's us-east-1 bucket got through within 10 s, against 10 of
      # 15 at 5000 ms (2026-10-23). infra/cdk/test/deploy-network.test.ts checks `network` against
      # the failed runs' logs.
      # A call whose connection goes quiet would wait for ever: the CLI's 5-minute request limit only
      # logs a warning. scripts/stall-guard.cjs ends it after 2 minutes without a byte, with
      # ETIMEDOUT, which the SDK retries (Deploy 40032504218 sat 57 minutes on one in Modern
      # Standby). And the step stops at 45 minutes, so whatever still hangs fails it and the
      # rollback runs: a job cancelled at its own limit skips every step after this one.
      # The App stack runs the new release's migrations on its new cron version before it moves
      # `live` (infra/cdk/lib/migrate-before-live.ts; AWS_MIGRATE_BEFORE_LIVE=off only to get past a
      # broken gate). A migration that failed in AWS is no dropped connection, whatever its error says
      # (a database's "connect ETIMEDOUT" matches `network`), and trying again would cost a full App
      # update and rollback each time: never run again. Repository variables reach the script through
      # env, never spliced into it.
      - name: Deploy (CDK)
        working-directory: infra/cdk
        timeout-minutes: 45
        env:
          AWS_MAX_ATTEMPTS: "10"
          NODE_OPTIONS: "--network-family-autoselection-attempt-timeout=5000 --require ${{ github.workspace }}/infra/cdk/scripts/stall-guard.cjs"
          SCHEDULES: "${{ vars.AWS_SCHEDULES }}"
          ALERT_EMAIL: "${{ vars.AWS_ALERT_EMAIL }}"
          GOOGLE_CLIENT_ID: "${{ vars.GOOGLE_SIGNIN_CLIENT_ID }}"
          MIGRATE: "${{ vars.AWS_MIGRATE_BEFORE_LIVE || 'on' }}"
        run: |
          deploy=(npx cdk deploy --all --require-approval never --concurrency 3 -c env=production -c "schedules=$SCHEDULES" -c "alertEmail=$ALERT_EMAIL" -c "googleClientId=$GOOGLE_CLIENT_ID" -c "migrate=$MIGRATE")
          network='could not be used to assume|no credentials have been configured|did not establish a connection|ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|getaddrinfo|socket hang up|TimeoutError|NetworkingError'
          log=$(mktemp)
          for attempt in 1 2 3; do
            if "${deploy[@]}" 2>&1 | tee "$log"; then exit 0; fi
            if grep -q "migrate-before-live failed" "$log"; then echo "::error::The App stack's migrate gate failed, so it rolled back with no live alias moved. The reason above says why: the cron's own error is a failed migration; an AWS error (AccessDenied, Throttling, ServiceException) means none ran, and Deploy can be run again (docs/aws-deployment.md, Migrations before the switch)."; exit 1; fi
            if ! grep -qE "$network" "$log"; then exit 1; fi
            if (( attempt < 3 )); then echo "::warning::cdk deploy failed on the network (attempt $attempt of 3); trying again in 60 s."; sleep 60; fi
          done
          echo "::error::cdk deploy failed on the network three times: check the PC's connection (docs/aws-deployment.md, Deploy (GitHub Actions))."
          exit 1
      # "Roll back on failure" moves `live` behind CloudFormation's back, so this run again for the
      # same commit finds the App stack with "no changes" and nothing moves the aliases forward: the
      # smoke tests then fail on the release before (Deploy 41661760406, 2026-11-03). So each alias
      # goes to the version the App stack deployed as live, unless it already runs that code (after a
      # restart for runtime settings, the same code published again). Those versions passed the
      # stack's migrate gate when it deployed them. Before the restart below, which refuses an alias
      # that doesn't run $LATEST's code. A commit whose rollback.mjs has no --to stack would read it
      # as "the version before": nothing to do then.
      - name: The live aliases run what the App stack deployed
        run: |
          if ! grep -q -- "--to stack" infra/cdk/scripts/rollback.mjs; then echo "::notice::This commit's rollback.mjs has no --to stack: nothing to check."; exit 0; fi
          node infra/cdk/scripts/rollback.mjs --env production --to stack
      # Runtime settings changed (Google switched on, say): an instance that started between the App
      # stack's alias move and the Auth stack's update holds the old ones for its lifetime. Publish
      # the same code again and move `live` (docs/aws-deployment.md, "Restarting the functions"),
      # only while $LATEST is exactly what `live` runs. Any failure fails the job, so the rollback runs.
      # Lambda publishes nothing new for an unchanged configuration (it hands back the last version),
      # so each restart writes this run's id into the description, replacing an earlier one's: a
      # second change on the same commit (Google switched off again) restarts them too.
      - name: Restart the functions on changed runtime settings
        env: { BEFORE: "${{ steps.runtime_before.outputs.digest }}", RUN: "${{ github.run_id }}.${{ github.run_attempt }}", MSYS_NO_PATHCONV: "1" }
        run: |
          set -euo pipefail
          after=$(aws ssm get-parameter --name /insights/production/runtime --query Parameter.Value --output text | sha256sum | cut -c1-64) || after=""
          # Not readable (the CLI's error above, or the step before's, says why): no way to tell, so no restart.
          if [[ "$BEFORE" == "unknown" || -z "$after" ]]; then echo "::warning::Couldn't read the runtime settings: the functions weren't restarted for them (docs/aws-deployment.md, Restarting the functions)."; exit 0; fi
          if [[ "$BEFORE" == "$after" ]]; then echo "Runtime settings unchanged: nothing to restart."; exit 0; fi
          echo "Runtime settings changed: publishing fresh versions of api, jobs and cron."
          for f in api jobs cron; do
            n="insights-production-$f"
            live=$(aws lambda get-alias --function-name "$n" --name live --query FunctionVersion --output text)
            live_sha=$(aws lambda get-function-configuration --function-name "$n" --qualifier "$live" --query CodeSha256 --output text)
            latest_sha=$(aws lambda get-function-configuration --function-name "$n" --query CodeSha256 --output text)
            if [[ "$live_sha" != "$latest_sha" ]]; then echo "::error::$n: \$LATEST is not the code live runs (version $live); not publishing it."; exit 1; fi
            aws lambda wait function-updated --function-name "$n"
            d=$(aws lambda get-function-configuration --function-name "$n" --query Description --output text)
            if [[ "$d" == "None" ]]; then d=""; fi
            base="${d%% · runtime settings reloaded*}"
            # Lambda descriptions hold 256 characters.
            aws lambda update-function-configuration --function-name "$n" --description "${base:0:200} · runtime settings reloaded (run $RUN)" > /dev/null
            aws lambda wait function-updated --function-name "$n"
            v=$(aws lambda publish-version --function-name "$n" --query Version --output text)
            if [[ "$v" == "$live" ]]; then echo "::error::$n: Lambda published no new version (still $live), so nothing would restart."; exit 1; fi
            aws lambda update-alias --function-name "$n" --name live --function-version "$v" > /dev/null
            echo "$n: live $live -> $v"
          done
      # The App stack already ran this release's migrations before moving `live`, so this normally
      # applies nothing. It stays for init.sql's grants and the roles' passwords from their secrets,
      # and for a commit from before the gate or deployed with AWS_MIGRATE_BEFORE_LIVE=off, whose
      # migrations run only here, after the switch: the warning names them. No read timeout (0): at
      # the CLI's 60 s default a slow migrate was sent a second time (migrate.ts's lock now queues
      # any duplicate). The step's own 10 minutes bound the wait instead, leaving the job time to roll
      # back after a Deploy (CDK) that used its 45; a longer migration fails the step while it still
      # commits, and running Deploy again then applies nothing. The payload has no newline of its
      # own: `echo` ends its line, so a warning after it starts one (only such a line is a command).
      - name: Database migrations
        timeout-minutes: 10
        run: |
          aws lambda invoke --function-name insights-production-cron:live --cli-binary-format raw-in-base64-out --cli-read-timeout 0 \
            --payload '{"action":"migrate"}' out.json > meta.json
          cat out.json; echo
          if grep -q FunctionError meta.json; then exit 1; fi
          node -e 'const a = JSON.parse(require("fs").readFileSync("out.json", "utf8")).applied || []; if (a.length) console.log("::warning::Migrations applied only after the new code went live: " + a.join(", ") + " (docs/aws-deployment.md, Migrations before the switch).");' || echo "::warning::Couldn't read what migrate applied (out.json)."
      - name: Re-read sales records a release left missing
        # Queues work only (seedSalesRereads in apps/worker); its failure is no reason to roll back.
        continue-on-error: true
        run: |
          aws lambda invoke --function-name insights-production-cron:live --cli-binary-format raw-in-base64-out \
            --payload '{"action":"reread"}' reread.json > reread-meta.json
          cat reread.json
          if grep -q FunctionError reread-meta.json; then exit 1; fi
      - name: Smoke tests
        id: smoke
        run: node infra/cdk/scripts/smoke.mjs --env production
      # The trust as just deployed must still admit this workflow, or the next deploy can't sign in.
      # Nothing to roll back if not: the release is fine, the role's trust needs fixing.
      - name: The next deploy can still sign in
        id: trust
        env: { ROLE: "${{ vars.AWS_DEPLOY_ROLE_ARN }}" }
        run: |
          if [[ ! -f infra/cdk/scripts/oidc-trust.ts ]]; then echo "::notice::This commit has no infra/cdk/scripts/oidc-trust.ts: nothing to check."; exit 0; fi
          pnpm --filter @infra/cdk exec tsx scripts/oidc-trust.ts assume --role "$ROLE" --region "$AWS_REGION"
      # The aliases move inside the App stack's update, after its migrate gate. A Deploy (CDK) cut off
      # mid-update (its 45 minutes, a stack beside App failing) leaves CloudFormation still going, and
      # a rollback before it settles would be undone by the alias move that follows. So wait for the
      # App stack to settle first, 5 minutes at most (the job's own limit has to leave room for it).
      - name: Roll back on failure
        if: failure() && steps.before.outputs.versions != '' && steps.trust.outcome != 'failure'
        timeout-minutes: 8
        env: { VERSIONS: "${{ steps.before.outputs.versions }}" }
        run: |
          for i in $(seq 1 30); do
            s=$(aws cloudformation describe-stacks --stack-name InsightsApp-production --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo unknown)
            [[ "$s" == *_IN_PROGRESS ]] || break
            echo "InsightsApp-production is $s: waiting for it to settle before rolling back ($i of 30)."; sleep 10
          done
          node infra/cdk/scripts/rollback.mjs --env production --to "$VERSIONS"

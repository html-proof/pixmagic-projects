# Shopify CLI app configuration (public, unlisted distribution).
# Deploy with: cd shopify-app && shopify app deploy
# URLs: production on AWS (docs/aws-deployment.md); keep shopify.app.pixmagic.toml on the same host.
client_id = "57e9ef75435db908617fdd46099afe0e"
name = "bizinsights"
application_url = "https://bizinsights.io/api/shopify/launch"
embedded = false

[access_scopes]
# Least privilege. THIS is what merchants are asked to grant: with
# use_legacy_install_flow = false (Shopify managed installation) the scopes come from this
# file, NOT from the `scope` parameter our authorize URL sends. SHOPIFY_SCOPES in the app's
# settings must mirror this list exactly - packages/core/test/appConfig.test.ts enforces that.
# read_all_orders: the store's whole order history, not Shopify's last 60 days. It has to be
# approved for the app first (Partner Dashboard -> API access requests -> Read all orders scope),
# or `shopify app deploy` refuses the version (docs/shopify-setup.md, "Full order history").
scopes = "read_orders,read_all_orders,read_products"
# Optional (dynamic) scopes: NOT part of the install grant. The install screen asks only for
# `scopes` above; these are requested afterwards, one feature at a time, when the merchant
# clicks "Enable" on a locked dashboard module (packages/core/src/scopes.ts,
# apps/api/src/routes/scopes.ts). Declaring them here is what makes them requestable at all -
# `declaredOptionalScopes` reads SHOPIFY_OPTIONAL_SCOPES (the ones every app declares, listed
# first here) plus this app's entry in SHOPIFY_APP_OPTIONAL_SCOPES (apps/aws/src/settings.ts),
# and an undeclared scope can never be granted however often we ask. appConfig.test.ts checks the
# settings never offer a scope this list lacks.
#
# read_reports (this app and PixMagic's only, never the App Store apps while Shopify reviews
# them): Shopify's own reports through ShopifyQL - its sessions, online store visitors, gross
# profit and the "Checked against Shopify" sales check. ShopifyQL also needs Level 2 protected
# customer data (name, email, phone, address fields) selected for the app, though none of it is
# read; development stores need no review. Declared here (and in APP_EXTRA_OPTIONAL_SCOPES) but
# offered to no store until it is added to this app's SHOPIFY_APP_OPTIONAL_SCOPES, after
# `shopify app deploy --config shopify.app.toml` has released it (docs/shopify-setup.md,
# "Shopify's reports").
#
# These three are protected customer data. Enabling them before "Protected customer data
# access" is approved makes Shopify refuse *new installs on live merchant stores*; development
# stores are exempt. That is accepted deliberately here, because it costs nothing today: the
# main app is unapproved and so cannot install on a live store at all, and the custom app's one
# store is already installed (the install screen is not shown again). Re-check this the day the
# main app is submitted - if PCD approval has not landed by then, comment this back out, clear
# SHOPIFY_OPTIONAL_SCOPES, and redeploy both. See docs/shopify-setup.md "Optional scopes".
# The Inventory module's stock levels, locations and stock changes (docs/inventory.md); none of
# them is protected customer data.
optional_scopes = ["read_customers", "write_pixels", "read_customer_events", "read_inventory", "read_locations", "write_inventory", "read_reports"]
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://bizinsights.io/api/shopify/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [
    "orders/create",
    "orders/updated",
    "orders/paid",
    "orders/cancelled",
    "orders/fulfilled",
    "orders/partially_fulfilled",
    # A deleted order leaves Shopify's reports, so it leaves the dashboard too.
    "orders/delete",
    "refunds/create",
    "products/create",
    "products/update",
    "products/delete",
    "app/uninstalled",
    "app/scopes_update",
    "app_subscriptions/update",
    # WhatsApp cart recovery (read_orders, like the order topics). Carrier tracking events
    # (fulfillments/*, fulfillment_events/create) need read_fulfillments, which isn't requested:
    # the worker reads shipment status from order payloads and a GraphQL poll instead.
    "checkouts/create",
    "checkouts/update"
  ]
  uri = "https://bizinsights.io/api/webhooks/shopify"

  # Mandatory GDPR compliance webhooks
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://bizinsights.io/api/webhooks/shopify"

[pos]
embedded = false

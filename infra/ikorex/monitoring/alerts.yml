# Alerts for bizinsights on the iKorex server: the CloudWatch alarms worth keeping, on Prometheus's
# metrics. Each goes to the owner by email (alertmanager.yml). Not here: the server being down and
# the nightly backup not running, which only an outside check can see (the uptime monitor and
# BACKUP_PING_URL).
groups:
  - name: app
    rules:
      - alert: AppDown
        expr: up{job=~"web|worker"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "The {{ $labels.job }} container isn't answering"
          description: "Prometheus can't reach {{ $labels.instance }}. docker compose -p bizinsights ps; docker compose -p bizinsights logs --tail 200 {{ $labels.job }}"
      - alert: ServerErrors
        expr: sum(rate(bizinsights_http_requests_total{status="5xx"}[5m])) / clamp_min(sum(rate(bizinsights_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "More than 5 % of requests are failing"
      - alert: SlowResponses
        expr: histogram_quantile(0.95, sum by (le) (rate(bizinsights_http_request_seconds_bucket{kind="api"}[10m]))) > 5
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "95 % of API requests take more than 5 s"
      - alert: DeadLetterJobs
        expr: max by (queue) (bizinsights_queue_jobs{state="dead"}) > 0
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "Jobs given up on in the {{ $labels.queue }} queue"
          description: "docker compose -p bizinsights --profile admin run --rm admin dlq {{ $labels.queue }}; after the cause is fixed: admin redrive {{ $labels.queue }}"
      - alert: QueueBacklog
        expr: max by (queue) (bizinsights_queue_oldest_ready_seconds) > 900
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "The {{ $labels.queue }} queue has had a job waiting over 15 minutes"
      - alert: JobsFailing
        expr: sum by (queue) (rate(bizinsights_jobs_total{outcome=~"threw|timeout|unsettled"}[15m])) > 0.05
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "Jobs in the {{ $labels.queue }} queue keep failing"
      # Only once a schedule has succeeded at least once (staging and the time before the cutover run none).
      - alert: ScheduleMissed
        expr: (time() - max by (schedule) (bizinsights_schedule_last_success_timestamp_seconds{schedule="every15min"})) > 3600
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "The every-15-minutes run hasn't succeeded for an hour (token refresh, sweeps)"
      - alert: NightlyMissed
        expr: (time() - max by (schedule) (bizinsights_schedule_last_success_timestamp_seconds{schedule="nightly"})) > 26 * 3600
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "The nightly run hasn't succeeded for over a day (reconcile, housekeeping)"

  - name: database
    rules:
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "PostgreSQL isn't answering"
      - alert: DatabaseConnections
        expr: sum(pg_stat_activity_count) > 60
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "PostgreSQL has over 60 of its 80 connections in use"
      - alert: WalArchiveFailing
        expr: increase(pg_stat_archiver_failed_count[15m]) > 0
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "The write-ahead log isn't reaching the backup bucket: point-in-time restore is falling behind"
          description: "docker compose -p bizinsights logs --tail 100 postgres; check env/postgres.env's PGBACKREST_REPO1_*"

  - name: host
    rules:
      - alert: DiskFilling
        expr: node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.20
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "The server's disk is over 80 % full"
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Under 10 % of the server's memory is available (the websites, n8n and CCTV share it)"
      - alert: HostBusy
        expr: node_load5 / scalar(count(node_cpu_seconds_total{mode="idle"})) > 1.5
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "The server's load has been over 1.5 per core for 15 minutes"
      - alert: TunnelDown
        expr: up{job="cloudflared"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "The Cloudflare tunnel container isn't answering: the site is unreachable"

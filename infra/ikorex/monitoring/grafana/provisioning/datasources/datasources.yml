apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  # Answers only with the logs profile on (docker-compose.monitoring.yml).
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

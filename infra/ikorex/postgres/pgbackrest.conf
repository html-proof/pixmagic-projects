# pgBackRest for bizinsights (docs/ikorex-migration): every backup and every archived WAL segment
# goes off the server, encrypted, to an S3-compatible bucket (Cloudflare R2 proposed). The bucket's
# address and keys and the encryption passphrase come from the environment (infra/ikorex/env.example):
#   PGBACKREST_REPO1_S3_ENDPOINT, PGBACKREST_REPO1_S3_BUCKET, PGBACKREST_REPO1_S3_KEY,
#   PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS
# Lose the passphrase and the backups can't be read: keep a copy away from the server (the guide says where).

[global]
repo1-type=s3
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-path=/bizinsights
repo1-cipher-type=aes-256-cbc
# Two weeks of full backups, and the WAL to restore to any moment inside them (RDS keeps 14 days).
repo1-retention-full-type=time
repo1-retention-full=14
compress-type=zst
compress-level=3
process-max=2
archive-async=y
spool-path=/var/spool/pgbackrest
lock-path=/tmp/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=off
start-fast=y
delta=y

[bizinsights]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=app

# PostgreSQL settings for bizinsights on the iKorex server (docs/ikorex-migration). Sized for the
# container's 2 GB memory limit (infra/ikorex/docker-compose.yml); change both together.

listen_addresses = '*'            # inside the Compose network only: no port is published on the host
port = 5432
max_connections = 80              # web + worker pools (~25), WhatsApp service (5), exporters, admin
password_encryption = scram-sha-256

# Memory (2 GB container)
shared_buffers = 512MB
effective_cache_size = 1200MB
work_mem = 8MB
maintenance_work_mem = 128MB
huge_pages = off

# Write-ahead log, archived continuously by pgBackRest (point-in-time restore loses at most
# archive_timeout: RDS's own figure is about 5 minutes too).
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=bizinsights archive-push %p'
archive_timeout = 300
max_wal_senders = 3
max_wal_size = 1GB
min_wal_size = 160MB
wal_compression = on
checkpoint_completion_target = 0.9

# Disk (SSD)
random_page_cost = 1.1
effective_io_concurrency = 200

# Logs to stderr (Docker keeps them; Loki reads them when enabled)
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 2000  # statements slower than 2 s
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 10MB
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.english'

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
track_io_timing = on

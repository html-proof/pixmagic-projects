# bizinsights on the iKorex server (docs/ikorex-migration). One Compose project, apart from
# everything else on the host: its own network and volumes, and NO published port. Cloudflare
# reaches the web role through the tunnel (cloudflared dials out); nothing else is reachable from
# outside. Every container has a memory and CPU limit, so bizinsights can't starve the websites,
# n8n or the CCTV tunnel that share the server.
#
#   cd ~/bizinsights && docker compose up -d                         # production (project "bizinsights")
#   docker compose -p bizinsights-staging --env-file .env.staging up -d  # staging, its own volumes
#   docker compose --profile admin run --rm admin <command>          # maintenance (apps/aws/src/admin.ts)
#
# Settings and secrets live in env/*.env on the server (mode 600), never in Git: env/*.example list
# them. .env holds only what this file reads: APP_TAG (deploy.sh sets it) and SCHEDULES.
name: bizinsights

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  image: bizinsights:${APP_TAG:?set APP_TAG in .env (scripts/deploy.sh does)}
  env_file: [env/app.env]
  networks: [internal]
  volumes: ["blobs:/data/blobs"]
  logging: *logging
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  # Long enough for running jobs to finish or hand themselves back (selfhost.ts, STOP_GRACE_MS 45 s).
  stop_grace_period: 60s
  depends_on:
    postgres: { condition: service_healthy }

services:
  web:
    <<: *app
    command: ["server.mjs", "web"]
    environment:
      DB_POOL_MAX: "8"
    mem_limit: 768m
    cpus: 1.0

  worker:
    <<: *app
    command: ["server.mjs", "worker"]
    environment:
      DB_POOL_MAX: "16"
      # Off until the cutover: a staging copy must never refresh tokens or reconcile stores by itself.
      SCHEDULES: ${SCHEDULES:-off}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9464/metrics').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 1536m
    cpus: 2.0

  # Maintenance only: `docker compose --profile admin run --rm admin migrate`. The one container given
  # the database owner's login (env/owner.env).
  admin:
    <<: *app
    profiles: ["admin"]
    env_file: [env/app.env, env/owner.env]
    entrypoint: ["node", "admin.mjs"]
    command: ["queues"]
    restart: "no"
    healthcheck: { disable: true }
    mem_limit: 768m
    cpus: 1.0

  postgres:
    build: ./postgres
    image: bizinsights-postgres:17.11
    env_file: [env/postgres.env]
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - pgspool:/var/spool/pgbackrest
      # The second backup repository, on this server's own disk (env/postgres.env, PGBACKREST_REPO2_*):
      # the write-ahead log goes to it from here, the backups from the backup container.
      - pgbackups:/var/lib/pgbackrest-local
    shm_size: 256m
    networks: [internal]
    logging: *logging
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # The image's entrypoint starts as root to own the data folder, then becomes `postgres`: these
    # five and nothing else (SECURITY_AUDIT.md).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql", "-U", "app", "-d", "app"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 2.0

  # Backups off the server, a second copy of them on it when that is set up, and the weekly restore
  # test (postgres/backup-loop.sh, restore-test.sh).
  backup:
    image: bizinsights-postgres:17.11
    user: postgres
    entrypoint: ["/usr/local/bin/backup-loop.sh"]
    env_file: [env/postgres.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - restoretest:/restore-test
      - pgbackups:/var/lib/pgbackrest-local
    networks: [internal]
    logging: *logging
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 768m
    cpus: 1.0

  # The WhatsApp service: the same pinned release and settings as on AWS (infra/cdk/lib/whatsapp-stack.ts).
  evolution:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    entrypoint: ["/bin/bash", "/bizinsights/start.sh"]
    env_file: [env/evolution.env]
    environment:
      TZ: UTC
      LANGUAGE: en
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://evolution:8080
      SERVER_DISABLE_DOCS: "true"
      SERVER_DISABLE_MANAGER: "true"
      CORS_ORIGIN: "*"
      EVO_DB_HOST: postgres
      EVO_DB_PORT: "5432"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_CLIENT_NAME: insights_a
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      DATABASE_DELETE_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      LOG_LEVEL: ERROR,WARN
      LOG_COLOR: "false"
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      DEL_TEMP_INSTANCES: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_REQUEST_TIMEOUT_MS: "10000"
      WEBHOOK_RETRY_MAX_ATTEMPTS: "10"
      WEBHOOK_RETRY_INITIAL_DELAY_SECONDS: "5"
      WEBHOOK_RETRY_USE_EXPONENTIAL_BACKOFF: "true"
      WEBHOOK_RETRY_MAX_DELAY_SECONDS: "300"
      CONFIG_SESSION_PHONE_CLIENT: bizinsights
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "6"
      QRCODE_COLOR: "#000000"
      TELEMETRY_ENABLED: "false"
      PROMETHEUS_METRICS: "false"
      WA_BUSINESS_URL: https://graph.facebook.com
      WA_BUSINESS_VERSION: v26.0
      WA_BUSINESS_LANGUAGE: en
    volumes:
      - ./evolution/start.sh:/bizinsights/start.sh:ro
    networks: [internal]
    logging: *logging
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # Root inside its image, writing only what root owns (its migrations, /tmp): no capability needed.
    cap_drop: [ALL]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/assets/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 1g
    cpus: 1.0

  # The only way in: an outbound tunnel to Cloudflare. Its public hostnames (bizinsights.io → http://web:8080,
  # staging and Grafana behind Cloudflare Access) are set on the tunnel in Cloudflare's dashboard.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    env_file: [env/cloudflared.env]
    networks: [internal]
    logging: *logging
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.5

networks:
  # Named <project>_internal by Compose (bizinsights_internal, bizinsights-staging_internal), which the
  # monitoring project (docker-compose.monitoring.yml) joins. Not `internal: true`: the app calls
  # Shopify, Meta, Google, Resend and Cognito.
  internal: {}

volumes:
  pgdata:
  pgsocket:
  pgspool:
  pgbackups:
  blobs:
  restoretest:

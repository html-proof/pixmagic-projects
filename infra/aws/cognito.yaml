AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Insights sign-in: an Amazon Cognito user pool (email + password, Google), its OAuth domain and
  the app's confidential app client. One stack per environment, included by infra/cdk (auth-stack.ts);
  docs/cognito-setup.md describes the pool.

Parameters:
  Environment:
    Type: String
    AllowedValues: [production, staging, development]
    Default: production
  AppUrl:
    Type: String
    Description: The web app's origin, no trailing slash (APP_URL), e.g. https://d2mr8m2p1qkh58.cloudfront.net
    AllowedPattern: "^https?://[^/]+$"
  ExtraCallbackUrls:
    Type: CommaDelimitedList
    Description: More origins allowed to finish a Google sign-in (e.g. http://localhost:8787 for a staging pool). Empty for production.
    Default: ""
  DomainPrefix:
    Type: String
    Description: Prefix of the pool's OAuth domain, <prefix>.auth.<region>.amazoncognito.com (unique in the region).
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth web client id. Empty = no Google sign-in yet.
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
  SesFromEmail:
    Type: String
    Default: ""
    Description: >-
      Verified SES sender for Cognito's emails, e.g. bizinsights <no-reply@example.com>. Empty = Cognito's
      own sender (no-reply@verificationemail.com, 50 emails a day per account: fine to start, not to grow on).
  SesIdentityArn:
    Type: String
    Default: ""
    Description: ARN of the SES identity (domain or address) SesFromEmail belongs to, in this region.
  CustomEmailSenderState:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
    Description: >-
      ENABLED: Cognito hands its emails (codes, temporary passwords) to the Lambda function
      CustomEmailSenderArn, which sends them through the app's own mail provider (Custom Email
      Sender trigger; infra/cdk auth-stack.ts). DISABLED: Cognito sends them itself, as
      EmailConfiguration says. A switch of its own because a condition can't read the ARNs when
      they come from other resources.
  CustomEmailSenderArn:
    Type: String
    Default: ""
    Description: ARN of that Lambda function.
  CustomEmailKmsKeyArn:
    Type: String
    Default: ""
    Description: ARN of the symmetric KMS key Cognito encrypts the codes with for that function.
  RefreshTokenRotation:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
    Description: >-
      ENABLED issues a new refresh token on every refresh (then set COGNITO_REFRESH_ROTATION=1 in the
      app's settings). Off by default: a response lost in transit then signs the person out.

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  HasSes: !Not [!Equals [!Ref SesFromEmail, ""]]
  HasCustomEmailSender: !Equals [!Ref CustomEmailSenderState, ENABLED]
  HasExtraCallbacks: !Not [!Equals [!Join ["", !Ref ExtraCallbackUrls], ""]]
  IsProduction: !Equals [!Ref Environment, production]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub insights-${Environment}
      # Essentials: passwordless email codes, refresh-token rotation, managed login. 10,000 monthly active users free.
      UserPoolTier: ESSENTIALS
      DeletionProtection: !If [IsProduction, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      # A changed email stays the old one until the code sent to the new one is entered.
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      Policies:
        # The same rule the app checks (packages/shared/src/auth.ts); employees' stricter rules are the app's.
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
        SignInPolicy:
          AllowedFirstAuthFactors: !If [HasSes, [PASSWORD, EMAIL_OTP], [PASSWORD]]
      MfaConfiguration: "OFF"
      # With the custom email sender below, Cognito sends no email itself: this, and the message
      # template, only apply without it.
      EmailConfiguration: !If
        - HasSes
        - EmailSendingAccount: DEVELOPER
          From: !Ref SesFromEmail
          SourceArn: !Ref SesIdentityArn
        - EmailSendingAccount: COGNITO_DEFAULT
      LambdaConfig: !If
        - HasCustomEmailSender
        - CustomEmailSender:
            LambdaArn: !Ref CustomEmailSenderArn
            LambdaVersion: V1_0
          KMSKeyID: !Ref CustomEmailKmsKeyArn
        - !Ref AWS::NoValue
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your bizinsights verification code
        EmailMessage: "Your bizinsights verification code is {####}. It expires in 24 hours. If you didn't ask for it, you can ignore this email."
      UserPoolTags:
        app: insights
        environment: !Ref Environment

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 2

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        # Without this a Google user's address counts as unverified, and the app won't link it to an existing account.
        email_verified: email_verified
        name: name
        given_name: given_name
        family_name: family_name

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub insights-web-${Environment}
      # Confidential: the secret lives on the server only, and signs every call (SECRET_HASH).
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_AUTH
      # Unknown users get the same answers as wrong passwords; password resets don't say whether an account exists.
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      RefreshTokenRotation:
        Feature: !Ref RefreshTokenRotation
        RetryGracePeriodSeconds: 60
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !If
        - HasExtraCallbacks
        - !Split [",", !Join ["", [!Sub "${AppUrl}/auth/callback", ",", !Join ["/auth/callback,", !Ref ExtraCallbackUrls], "/auth/callback"]]]
        - [!Sub "${AppUrl}/auth/callback"]
      LogoutURLs: !If
        - HasExtraCallbacks
        - !Split [",", !Join ["", [!Sub "${AppUrl}/login?signedOut=1", ",", !Join ["/login?signedOut=1,", !Ref ExtraCallbackUrls], "/login?signedOut=1"]]]
        - [!Sub "${AppUrl}/login?signedOut=1"]
      SupportedIdentityProviders:
        - COGNITO
        - !If [HasGoogle, !Ref GoogleProvider, !Ref AWS::NoValue]

  # The default look for the few user-pool pages a person can see (sign-out, errors).
  WebClientBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true

  # The app client's secret, read by the API function at cold start (COGNITO_WORKER_SECRET_ARN).
  # The pool's admin calls are signed with the function's own role, which infra/cdk grants them.
  WorkerSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub insights/${Environment}/worker-cognito
      Description: Insights Worker secrets for Cognito (app client secret, admin access key)
      SecretString: !Sub
        - '{"COGNITO_CLIENT_SECRET":"${ClientSecret}"}'
        - ClientSecret: !GetAtt WebClient.ClientSecret

Outputs:
  Region:
    Value: !Ref AWS::Region
    Description: COGNITO_REGION
  UserPoolId:
    Value: !Ref UserPool
    Description: COGNITO_USER_POOL_ID
  ClientId:
    Value: !Ref WebClient
    Description: COGNITO_CLIENT_ID
  Domain:
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com
    Description: COGNITO_DOMAIN
  IdentityProviders:
    Value: !Join [",", [!If [HasGoogle, Google, !Ref AWS::NoValue]]]
    Description: COGNITO_IDENTITY_PROVIDERS
  Issuer:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  ProviderRedirectUri:
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse
    Description: Add this as an authorized redirect URI on the Google OAuth client.
  WorkerSecretsArn:
    Value: !Ref WorkerSecrets
  UserPoolArn:
    Value: !GetAtt UserPool.Arn

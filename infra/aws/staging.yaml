AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Insights on AWS, isolated Phase 1 environment (sign-in on Cognito): one Lambda function URL serving
  the web UI and the API (apps/aws), PostgreSQL on RDS, a DynamoDB table for rate limits and
  one-time sign-in state, CloudWatch logs and alarms. Deployed by infra/aws/deploy-staging.sh
  together with infra/aws/cognito.yaml. Background jobs (Shopify sync, webhooks) are not run here.

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, development]
    Default: staging
  CodeBucket:
    Type: String
    Description: S3 bucket holding the function package (apps/aws dist/function.zip).
  CodeKey:
    Type: String
  Commit:
    Type: String
    Default: unknown
    Description: Git commit the package was built from (shown in the function's tags and environment).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the database (the account's default VPC).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets of that VPC, in different Availability Zones.
  AppSecretArn:
    Type: String
    Description: Secrets Manager secret with SESSION_SECRET, TOKEN_ENCRYPTION_KEYS, OTP_PEPPER and APP_RLS_PASSWORD.
  AppUrl:
    Type: String
    Default: ""
    Description: The function URL without a trailing slash, once known. Empty = the function uses the address it is called on.
  CognitoUserPoolId:
    Type: String
    Default: ""
  CognitoClientId:
    Type: String
    Default: ""
  CognitoDomain:
    Type: String
    Default: ""
  CognitoIdentityProviders:
    Type: String
    Default: ""
  CognitoSecretArn:
    Type: String
    Default: ""
    Description: The Cognito stack's WorkerSecretsArn (holds the app client secret).
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro

Conditions:
  HasCognito: !Not [!Equals [!Ref CognitoUserPoolId, ""]]
  HasCognitoSecret: !Not [!Equals [!Ref CognitoSecretArn, ""]]
  HasAppUrl: !Not [!Equals [!Ref AppUrl, ""]]

Resources:
  # ---------------- Database ----------------

  # The function runs outside the VPC (it calls Cognito, which a private VPC would need a NAT
  # gateway for), so the database takes connections from the internet: TLS is enforced
  # (rds.force_ssl) and verified by the app, and the password lives only in Secrets Manager.
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Insights ${Environment} PostgreSQL (TLS only, password in Secrets Manager)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: The Lambda function (no fixed address)

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Insights ${Environment}
      SubnetIds: !Ref SubnetIds

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres17
      Description: !Sub Insights ${Environment} (TLS required)
      Parameters:
        rds.force_ssl: "1"

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub insights-${Environment}
      Engine: postgres
      EngineVersion: "17.11"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: app
      MasterUsername: app
      # RDS creates the password and keeps it in Secrets Manager (MasterUserSecret).
      ManageMasterUserPassword: true
      PubliclyAccessible: true
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBParameterGroupName: !Ref DbParameterGroup
      BackupRetentionPeriod: 1
      MultiAZ: false
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - { Key: app, Value: insights }
        - { Key: environment, Value: !Ref Environment }

  # ---------------- Coordinator (rate limits, OAuth state, signed-out sessions, locks) ----------------

  CoordTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub insights-${Environment}-coord
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: k, AttributeType: S }
      KeySchema:
        - { AttributeName: k, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: exp
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - { Key: app, Value: insights }
        - { Key: environment, Value: !Ref Environment }

  # ---------------- The function ----------------

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/insights-${Environment}
      RetentionInDays: 30

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: insights-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${LogGroup.Arn}:*
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt CoordTable.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - HasCognitoSecret
                  - [!Ref AppSecretArn, !GetAtt Database.MasterUserSecret.SecretArn, !Ref CognitoSecretArn]
                  - [!Ref AppSecretArn, !GetAtt Database.MasterUserSecret.SecretArn]
              # The five Cognito admin calls the app makes (instead of an IAM user's access key).
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminUserGlobalSignOut
                Resource: !If
                  - HasCognito
                  - !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
                  - !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/none

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub insights-${Environment}
      Description: !Sub Insights ${Environment} web UI + API (${Commit})
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 1024
      Timeout: 30
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      LoggingConfig:
        LogGroup: !Ref LogGroup
        LogFormat: Text
      Environment:
        Variables:
          NODE_ENV: production
          LOG_LEVEL: info
          APP_COMMIT: !Ref Commit
          # Database TLS is verified against Amazon's RDS CA (bundled with the package).
          NODE_EXTRA_CA_CERTS: /var/task/rds-ca.pem
          APP_SECRET_ARN: !Ref AppSecretArn
          COGNITO_WORKER_SECRET_ARN: !Ref CognitoSecretArn
          DB_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: app
          COORD_TABLE: !Ref CoordTable
          APP_URL: !If [HasAppUrl, !Ref AppUrl, !Ref AWS::NoValue]
          API_URL: !If [HasAppUrl, !Sub "${AppUrl}/api", !Ref AWS::NoValue]
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_DOMAIN: !Ref CognitoDomain
          COGNITO_IDENTITY_PROVIDERS: !Ref CognitoIdentityProviders
          # App emails (invitations, alerts) aren't sent from here (apps/aws/src/index.ts).
          EMAIL_FROM: Insights <no-reply@example.com>
      Tags:
        - { Key: app, Value: insights }
        - { Key: environment, Value: !Ref Environment }
        - { Key: commit, Value: !Ref Commit }

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  # Anyone may call the URL (it is a website); nobody may invoke the function any other way.
  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------------- Monitoring ----------------

  # The app logs "sign-in service unavailable" when Cognito (or Firebase, during the move) fails.
  AuthUnavailableFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"sign-in service unavailable"'
      MetricTransformations:
        - MetricNamespace: !Sub Insights/${Environment}
          MetricName: AuthServiceUnavailable
          MetricValue: "1"
          DefaultValue: 0

  AuthUnavailableAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub insights-${Environment}-auth-unavailable
      AlarmDescription: Sign-in calls to Cognito are failing (not wrong passwords; the service itself).
      Namespace: !Sub Insights/${Environment}
      MetricName: AuthServiceUnavailable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub insights-${Environment}-function-errors
      AlarmDescription: The function crashed or timed out (not handled API errors).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref Function }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  FunctionUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref Function
  LogGroupName:
    Value: !Ref LogGroup
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  CoordTableName:
    Value: !Ref CoordTable
